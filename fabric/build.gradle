plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

// Compile the shared :common sources into this jar (against Loom's Minecraft view). The
// standalone :common project additionally compiles them against vanilla NeoForm as a
// platform-agnostic purity check. Assets/data stay in shared-resources.
sourceSets.main.java.srcDir "${rootProject.projectDir}/common/src/main/java"

repositories {
    // Modrinth — for Jade (and any future modded compile-only deps). Gradle resolves the
    // jar through its standard cache so CI doesn't need a local file in run/mods.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No `mappings` line — Minecraft 26.1 is deobfuscated and ships Mojang's official names.

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Jade — compile-only. Players still need Jade installed at runtime for the tooltip to
    // show; our plugin class is loaded only when Jade detects it via the "jade" entrypoint.
    // Pulled from Modrinth maven so CI builds without a local jar in run/mods.
    compileOnly "maven.modrinth:jade:26.1.0+fabric"

    // ModMenu — compile-only, same pattern: the "modmenu" entrypoint gives the mod list a
    // Configure button (opening the shared HydrofarmConfigScreen) when ModMenu is installed.
    compileOnly "maven.modrinth:modmenu:20.0.0-beta.2"

    // Team Reborn Energy — the Fabric energy standard (used by TechReborn, Modern Industrialization,
    // etc.). Bundled jar-in-jar via `include` so it's always present and no tech mod is required at
    // runtime; the Hydroelectric Generator exposes energy through it. Resolves from FabricMC maven
    // (added by Loom). See `team.reborn.energy.api.EnergyStorage`.
    implementation "teamreborn:energy:5.0.0"
    include "teamreborn:energy:5.0.0"
}

loom {
    mods {
        "hydrofarm" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client { runDir = "../run" }
        server { runDir = "../run" }
    }
}

processResources {
    inputs.property "version", project.version
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from('../shared-resources') {
        exclude '**/*.java'
    }

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
}

jar {
    from("../LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
