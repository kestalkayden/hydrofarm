plugins {
    id 'java'
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    // Mod Menu and Jade both come from the Modrinth maven (declared per-module with an
    // includeGroup filter), so neither maven.terraformersmc.com nor maven.shedaniel.me is needed.
    // Both are deliberately absent rather than merely unused: Gradle contacts every declared
    // repository in order on a resolution miss, and terraformersmc has a history of serving
    // truncated bodies for large jars (HTTP 200, then a premature end of the chunked response) —
    // which fails the build for a dependency it does not even host. Do not re-add a repository
    // without a coordinate that actually resolves from it.
    repositories {
        maven { name = 'Fabric';    url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        mavenCentral()
    }
}

allprojects {
    version = project.mod_version
    group = project.maven_group
}

tasks.register('buildAll') {
    dependsOn ':fabric:build', ':neoforge:build'
    description = 'Builds both Fabric and NeoForge versions.'
}
